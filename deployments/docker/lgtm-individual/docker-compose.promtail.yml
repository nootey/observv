services:
  promtail:
    image: grafana/promtail:latest
    volumes:
      - ../../../pkg/config/promtail/promtail-config.yaml:/etc/promtail/config.yaml       # custom config
      - ../../../logs:/app/logs                                      # host logs
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - lgtm-net

networks:
  lgtm-net:
    external: true