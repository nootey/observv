name: observv

x-app: &app
  build:
    context: .
    dockerfile: ./build/Dockerfile
    args:
      VERSION: ${VERSION:-dev}
  image: observv:local

x-app-env: &app-env
  APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
  APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
  DATABASE_HOST: db
  DATABASE_PORT: 5432
  DATABASE_USER: ${POSTGRES_USER:-postgres}
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  DATABASE_NAME: ${POSTGRES_DB:-observv}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
  OTEL_METRIC_EXPORT_INTERVAL: 15000
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}

services:
  traefik:
    image: traefik:v3.7.16
    profiles: ["proxy"]
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Redirect HTTP to HTTPS
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # ACME
      - --certificatesresolvers.le.acme.email=${TRAEFIK_EMAIL:-}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-observv}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-observv}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    <<: *app
    environment:
      <<: *app-env
    entrypoint: ["migrate"]
    command: ["up"]
    depends_on:
      db:
        condition: service_healthy

  seed:
    <<: *app
    environment:
      <<: *app-env
      SEED_TERMINALS: ${SEED_TERMINALS:-10}
    entrypoint: ["seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *app
    restart: unless-stopped
    environment:
      <<: *app-env
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      CHAOS_LATENCY_MS: ${CHAOS_LATENCY_MS:-0}
      CHAOS_ERROR_RATE: ${CHAOS_ERROR_RATE:-0}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3
    depends_on:
      seed:
        condition: service_completed_successfully

  simulator:
    <<: *app
    restart: unless-stopped
    environment:
      <<: *app-env
      SIMULATOR_API_URL: http://api:8080
      SIMULATOR_INTERVAL_SECONDS: ${SIMULATOR_INTERVAL_SECONDS:-5}
      SIMULATOR_STATUS_FLIP_CHANCE: ${SIMULATOR_STATUS_FLIP_CHANCE:-0.1}
      SIMULATOR_MAX_TRANSFER_BYTES: ${SIMULATOR_MAX_TRANSFER_BYTES:-100000000}
    entrypoint: ["simulator"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  traefik_letsencrypt:
