apiVersion: 1

# Fixed UIDs, so the signals can link to each other. $$ escapes $ in provisioning files.
datasources:
  - name: Mimir
    type: prometheus
    uid: mimir
    access: proxy
    url: http://mimir:9009/prometheus
    isDefault: true
    jsonData:
      httpMethod: POST
      prometheusType: Mimir
      manageAlerts: true
      alertmanagerUid: alertmanager
      # Metrics to traces
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
          urlDisplayLabel: View trace

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # Traces to logs
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        filterByTraceID: true
        tags:
          - key: service.name
            value: service_name
      # Traces to metrics, from the span metrics that Tempo writes to Mimir
      tracesToMetrics:
        datasourceUid: mimir
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        tags:
          - key: service.name
            value: service
        queries:
          - name: Request rate
            query: sum by (span_name) (rate(traces_spanmetrics_calls_total{$$__tags}[5m]))
          - name: Error rate
            query: sum by (span_name) (rate(traces_spanmetrics_calls_total{$$__tags, status_code="STATUS_CODE_ERROR"}[5m]))
          - name: p95 latency
            query: histogram_quantile(0.95, sum by (le, span_name) (rate(traces_spanmetrics_latency_bucket{$$__tags}[5m])))
      serviceMap:
        datasourceUid: mimir
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: loki

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Logs to traces. trace_id is structured metadata, not part of the log line.
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: $${__value.raw}
          urlDisplayLabel: View trace

  - name: Alertmanager
    type: alertmanager
    uid: alertmanager
    access: proxy
    url: http://mimir:9009
    jsonData:
      implementation: mimir
      handleGrafanaManagedAlerts: false
